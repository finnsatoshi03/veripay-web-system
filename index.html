<html lang="en">

    <!-- Favicon -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Branding -->

    <!-- <meta property="og:url" content="https://www.veripay.app/"> -->

      property="twitter:title"
      content="Veripay | Smarter Payroll. Seamless HR."

    />
